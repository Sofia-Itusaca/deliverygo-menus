name: menu-service
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Explicit opt-in for deploying only the menu service
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.txt}
      - name: Verify SPEC documents and CI contract
        id: specs
        run: python scripts/verify_specs.py
      - name: Test SPEC verifier
        id: spec_tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - id: dependencies
        run: pip install -r requirements.txt
      - id: tests
        run: python -m unittest discover -s tests -v
      - id: build
        run: python -m compileall -q app
      - id: lint
        run: pip install ruff && ruff check app --select E9,F63,F7,F82
      - uses: docker/build-push-action@v6
        id: docker
        with: {context: ., push: false, load: true, tags: deliverygo-menus:ci}
      - uses: aquasecurity/trivy-action@v0.36.0
        id: trivy
        with: {image-ref: deliverygo-menus:ci, format: table, exit-code: '1', severity: 'CRITICAL,HIGH'}
      - name: Record CI evidence
        if: always()
        run: |
          echo "## DeliveryGo Menus CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID; commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "SPEC: ${{ steps.specs.outcome }}; verifier tests: ${{ steps.spec_tests.outcome }}; dependencies: ${{ steps.dependencies.outcome }}; tests: ${{ steps.tests.outcome }}; compile: ${{ steps.build.outcome }}; lint: ${{ steps.lint.outcome }}; Docker: ${{ steps.docker.outcome }}; Trivy: ${{ steps.trivy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true' && vars.ECR_REPOSITORY == 'deliverygo-menus' && vars.EKS_CLUSTER != ''
    needs: ci
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: '${{ secrets.AWS_ROLE_ARN }}', aws-region: us-east-2}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login
      - run: docker build -t ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} . && docker push ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - run: sed -i "s|ACCOUNT.dkr.ecr.us-east-2.amazonaws.com/deliverygo-menus:IMAGE_TAG|${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}|g" k8s/deployment.yaml
      - run: aws eks update-kubeconfig --name '${{ vars.EKS_CLUSTER }}' --region us-east-2 && kubectl apply -f k8s/namespace.yaml -f k8s/deployment.yaml -n deliverygo && kubectl rollout status deployment/deliverygo-menus -n deliverygo --timeout=180s
